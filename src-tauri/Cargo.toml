[package]
name = "pizzic"
version = "0.1.0"
edition = "2021"
description = "Pizzic — Agent 指令文件工作台：模块化管理与动态拼接"

[lib]
name = "pizzic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = "8"
tempfile = "3"
trash = "5"

# 原生启动窗：自绘启动壳位图，在 WebView2 首帧出来之前顶上。
[target.'cfg(windows)'.dependencies]
png = "0.18"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
