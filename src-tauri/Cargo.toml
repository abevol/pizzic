[package]
name = "pizzic"
version = "0.1.0"
edition = "2021"
description = "Pizzic — Agent 指令文件工作台：模块化管理与动态拼接"

[lib]
name = "pizzic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = "8"
tempfile = "3"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
